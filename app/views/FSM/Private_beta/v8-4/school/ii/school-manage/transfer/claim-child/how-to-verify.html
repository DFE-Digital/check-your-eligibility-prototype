{% extends "layouts/FSM/v8-4/layout-dfe-schoolnav-ii.html" %}
{% set Service="Manage eligibility for free school meals" %}
{% set pageName="How do you want to find a child record?" %}

{% block content %}

<div class="govuk-width-container">
  <main class="govuk-main-wrapper govuk-main-wrapper--m">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <!-- <h1 class="govuk-heading-l">{{ pageName }}</h1> -->



<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
      <h1 class="govuk-fieldset__heading">
{{ pageName }}
      </h1>
    </legend>
    <p class="govuk-body">
Select the details you will enter to find the child's record.
        </p>
    <div class="govuk-radios" data-module="govuk-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="verify-upn" name="howToVerify" type="radio" value="verify-upn">
        <label class="govuk-label govuk-radios__label" for="verify-upn">
          Unique pupil number (UPN)
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="verify-child" name="howToVerify" type="radio" value="verify-child">
        <label class="govuk-label govuk-radios__label" for="verify-child">
          Child details
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="verify-parent" name="howToVerify" type="radio" value="verify-parent">
        <label class="govuk-label govuk-radios__label" for="verify-parent">
          Parent details
        </label>
      </div>
      <!-- <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="whereDoYouLive-4" name="whereDoYouLive" type="radio" value="northern-ireland">
        <label class="govuk-label govuk-radios__label" for="whereDoYouLive-4">
          Northern Ireland
        </label>
      </div> -->


    <div class="govuk-button-group govuk-!-margin-top-6">
      <button id="continue-button" class="govuk-button" type="button" data-module="govuk-button">
        Continue
      </button>
    </div>
  </fieldset>
</div>

<script>
  document.getElementById('continue-button').addEventListener('click', function (event) {
    const selectedOption = document.querySelector('input[name="howToVerify"]:checked');

    if (!selectedOption) {
      event.preventDefault();
      return;
    }

    window.location.href = selectedOption.value;
  });
</script>
