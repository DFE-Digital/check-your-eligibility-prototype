{% extends "layouts/FSM/v8-4/layout-dfe-schoolnav.html" %}
{% set Service="Manage eligibility for free school meals" %}
{% set pageName="What is the child's unique pupil number (UPN)?" %}

{% block content %}

<div class="govuk-width-container">
  <main class="govuk-main-wrapper govuk-main-wrapper--m">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-l">{{ pageName }}</h1>

        <p class="govuk-body">
          A UPN is 13 characters long.
        </p>

        <!-- <div class="govuk-inset-text">
          <p class="govuk-body govuk-!-margin-bottom-2">You will need:</p>
          <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-0">
            <li>the parent's National Insurance number</li>
            <li>the parent's surname</li>
            <li>the parent's date of birth</li>
            <li>the child's first and last name</li>
          </ul>
        </div> -->

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="upn">
            UPN
          </label>
          <div id="upn-hint" class="govuk-hint">
            For example, A123456789012
          </div>
          <input
            class="govuk-input govuk-input--width-20"
            id="upn"
            name="upn"
            type="text"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="upn-hint"
            maxlength="13">
        </div>

        <div class="govuk-button-group govuk-!-margin-top-6">
          <button id="continue-button" class="govuk-button" type="button" data-module="govuk-button">
            Continue
          </button>
        </div>

        <script>
          document.getElementById('continue-button').addEventListener('click', function () {
            const upnInput = document.getElementById('upn');
            const enteredUpn = (upnInput.value || '').trim().toUpperCase();

            if (!enteredUpn) {
              return;
            }

            if (enteredUpn === 'A123456789012') {
              window.location.href = 'child-found-linked.html';
              return;
            }

            window.location.href = 'child-not-found.html';
          });
        </script>

      </div>

    </div>


</main>
</div>







    {% endblock %}
